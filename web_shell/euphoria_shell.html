	right: auto;
	bottom: auto;

	height: var(--lh) !important;

	padding: 0;

	height: 100%;

	if (missing.length !== 0) {
		const missingMsg = 'Error\nFitur yang dibutuhkan browser tidak tersedia:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		setBar(null);
		startSlides();
		statusText.textContent = 'Memulai unduhan aset game...';
		statusDetail.textContent = 'Pertama kali agak lama — berikutnya jauh lebih cepat (tersimpan di cache).';
		// rotating gameplay tips while loading
		const TIPS = [
			'<b>Tip:</b> Tank di kolom depan menahan serangan — hero menyerang musuh di <b>baris yang sama</b>.',
			'<b>Tip:</b> Ketuk <b>hati berdenyut</b> di lobby setiap hari untuk Secretary Moment bersama hero-mu.',
			'<b>Tip:</b> 150 Summon Point di banner rate-up bisa ditukar langsung dengan <b>hero unggulan</b>.',
			'<b>Tip:</b> Pasang pasangan <b>Story Links</b> (misalnya Shina + Zennyo) untuk bonus stat.',
			'<b>Tip:</b> <b>Commander Tactics</b> aktif otomatis sekali per battle — pilih sesuai lawan.',
			'<b>Tip:</b> Boss Hunt memberi <b>Hunt Core</b> untuk Limit Break hingga Lv.100.',
			'<b>Tip:</b> Di <b>Starlight Rift</b>, Blessing menumpuk sepanjang run. Satu kekalahan mengakhiri run.',
			'<b>Tip:</b> Setiap hero punya <b>ruangan favorit</b> di Private Room — Bond dua kali lipat di sana.',
			'<b>Tip:</b> Ketuk cincin <b>TODAY</b> di lobby untuk melihat semua aktivitas harian.',
			'<b>Tip:</b> <b>COLLECT ALL</b> di Today\'s Board mengambil semua hadiah yang siap sekaligus.',
			'<b>Tip:</b> Pasang <b>Wishlist</b> di banner Standard — SSR pilihanmu lebih sering muncul.',
			'<b>Tip:</b> Coba tim barumu di <b>Training Ground</b> dulu: gratis, tanpa stamina.',
			'<b>Tip:</b> Tombol <b>▲ BOOST</b> di Formation menaikkan level seluruh tim sekali ketuk.',
			'<b>Tip:</b> Kalah bertahan di Arena? Balas lewat <b>REVENGE</b> — gratis dan memberi RP ekstra.',
			'<b>Tip:</b> Save-mu dicadangkan otomatis tiap hari. Lihat <b>Automatic Backups</b> di Settings.',
			'<b>Tip:</b> Tekan ☆ pada menu favoritmu untuk <b>menyematkannya</b> di baris teratas MENU.',
		];
		const tipEl = document.getElementById('status-tip');
		let tipIdx = Math.floor(Math.random() * TIPS.length);
		function nextTip() {
			tipEl.style.opacity = 0;
			setTimeout(function () { tipEl.innerHTML = TIPS[tipIdx % TIPS.length]; tipIdx++; tipEl.style.opacity = 1; }, 450);
		}
		nextTip();
		const tipTimer = setInterval(nextTip, 6000);
		const pctEl = document.getElementById('status-pct');
		// remaining time from the recent download speed (smoothed; shown once it is stable)
		let etaT0 = 0;
		let etaB0 = 0;
		let etaRate = 0;
		function eta(current, total) {
			const now = performance.now();
			if (etaT0 === 0 || current < etaB0) {
				etaT0 = now;
				etaB0 = current;
				return '';
			}
			const dt = (now - etaT0) / 1000;
			if (dt < 1.5) {
				return etaRate > 0 ? fmtEta((total - current) / etaRate) : '';
			}
			const r = (current - etaB0) / dt;
			etaRate = etaRate > 0 ? etaRate * 0.7 + r * 0.3 : r;
			etaT0 = now;
			etaB0 = current;
			return etaRate > 0 ? fmtEta((total - current) / etaRate) : '';
		}
		function fmtEta(sec) {
			if (!isFinite(sec) || sec <= 1) {
				return '';
			}
			if (sec < 60) {
				return '  •  ±' + Math.ceil(sec) + ' dtk lagi';
			}
			return '  •  ±' + Math.ceil(sec / 60) + ' mnt lagi';
		}
		function pct100(current, total) {
			return Math.min(100, Math.round((current / total) * 100));
		}
		let reconnecting = false;
		if (window.__euphoriaNet) {
			window.__euphoriaNet.onRetry = function (hidden, fails) {
				reconnecting = true;
				statusText.textContent = hidden ? 'Unduhan dijeda (tab di latar belakang)' : 'Koneksi terputus — menyambung ulang... (' + fails + ')';
				statusDetail.textContent = 'Tenang, unduhan lanjut dari posisi terakhir, tidak mulai dari awal.';
			};
			window.__euphoriaNet.onResume = function () {
				statusText.textContent = 'Melanjutkan unduhan...';
			};
		}

		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					setBar(pct100(current, total) >= 100 ? null : current / total);
					const pct = Math.min(100, Math.round((current / total) * 100));
					const curMB = (current / (1024 * 1024)).toFixed(1);
					const totMB = (total / (1024 * 1024)).toFixed(1);
					pctEl.textContent = pct + '%';
					statusText.textContent = 'Mengunduh aset: ' + curMB + ' MB / ' + totMB + ' MB' + eta(current, total);
					reconnecting = false;
					if (pct < 100) {
						statusDetail.textContent = 'Mengunduh data grafik karakter & cutscene HD...';
					} else {
						statusText.textContent = 'Unduhan selesai! Menyiapkan dunia Euphoria...';
						statusDetail.textContent = 'Memulai engine grafis, mohon tunggu beberapa detik...';
					}
				} else {
					setBar(null);
				}
			},
		}).then(() => {
			// Ready. One tap enters the game: browsers only allow sound, full screen and the landscape lock
			// after the player touches the page, and the studio logo waits for it (studio_intro.gd).
			clearInterval(tipTimer);
			statusOverlay.classList.add('ready');
			pctEl.textContent = '100%';
			statusText.textContent = 'Siap! Dunia Euphoria menunggumu.';
			const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
			const standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
			if (ios && !standalone) {
				document.getElementById('ld-ios').style.display = 'block';
			}
			let entered = false;
			const enter = function (ev) {
				if (entered) {
					return;
				}
				if (ev && ev.target && ev.target.closest && ev.target.closest('#status-notice')) {
					return;
				}
				entered = true;
				// sound: wake the engine's audio inside this tap (iOS requires it here)
				try {
					const ga = window.__eoAudio && window.__eoAudio();
					if (ga && ga.ctx && ga.ctx.state !== 'running') {
						ga.ctx.resume();
					}
				} catch (e) { /* ignore */ }
				// Android / desktop touch: real full screen and a landscape lock
				const de = document.documentElement;
				const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
				if (coarse && de.requestFullscreen && !document.fullscreenElement) {
					de.requestFullscreen({ navigationUI: 'hide' }).then(function () {
						if (screen.orientation && screen.orientation.lock) {
							screen.orientation.lock('landscape').catch(function () {});
						}
					}).catch(function () {});
				}
				window.__eoEntered = true;
				statusOverlay.style.transition = 'opacity 0.45s ease';
				statusOverlay.style.opacity = '0';
				setTimeout(function () { setStatusMode('hidden'); }, 470);
			};
			statusOverlay.addEventListener('click', enter);
			document.getElementById('ld-enter').addEventListener('click', enter);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
