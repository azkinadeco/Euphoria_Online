<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Euphoria Online</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background: radial-gradient(ellipse at 50% 40%, #2a1748 0%, #120a22 55%, #07040e 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-container {
	position: absolute;
	bottom: 8%;
	left: 5%;
	right: 5%;
	display: flex;
	flex-direction: column;
	align-items: center;
	z-index: 10;
}

#status-progress {
	width: 80%;
	max-width: 420px;
	height: 12px;
	border-radius: 6px;
	overflow: hidden;
	appearance: none;
	-webkit-appearance: none;
	border: 1px solid rgba(232, 190, 98, 0.75);
	background: rgba(20, 10, 34, 0.85);
	box-shadow: 0 0 18px rgba(255, 200, 110, 0.25);
}

#status-progress::-webkit-progress-bar {
	background: rgba(20, 10, 34, 0.85);
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #8a4fd8, #e8be62, #fff1c4);
	border-radius: 6px;
	box-shadow: 0 0 10px #ffd479;
}
#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #8a4fd8, #e8be62, #fff1c4);
}
#status-pct {
	color: #ffe9b0;
	font-family: Georgia, "Times New Roman", serif;
	font-size: 34px;
	font-weight: 700;
	margin-bottom: 8px;
	text-shadow: 0 0 14px rgba(255, 200, 110, 0.6), 0 2px 0 #3a1f00;
	letter-spacing: 1px;
}
#status-tip {
	color: #e8dcff;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	font-size: 13px;
	margin-top: 14px;
	max-width: 520px;
	text-align: center;
	min-height: 2.6em;
	transition: opacity 0.5s;
	padding: 8px 14px;
	border-radius: 10px;
	background: rgba(42, 23, 72, 0.6);
	border: 1px solid rgba(232, 190, 98, 0.35);
}
#status-tip b { color: #ffd479; }

#status-text {
	color: #ffd479;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	font-size: 13px;
	font-weight: 600;
	margin-top: 10px;
	letter-spacing: 0.5px;
	text-shadow: 0 0 10px rgba(255, 200, 110, 0.45);
	text-align: center;
}

#status-detail {
	color: #b8a8d8;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	font-size: 11px;
	margin-top: 4px;
	text-align: center;
}

#status-retry {
	display: block;
	margin: 0.8rem auto 0.2rem;
	padding: 0.6rem 1.6rem;
	border: 1px solid #ffd479;
	border-radius: 2rem;
	background: linear-gradient(#ffcf6b, #e09a2c);
	color: #3a1d05;
	font-weight: bold;
	font-size: 1rem;
	cursor: pointer;
}

#status-notice {
	background-color: rgba(91, 57, 67, 0.95);
	border-radius: 0.5rem;
	border: 1px solid #ff4b6e;
	color: #fff;
	font-family: -apple-system, BlinkMacSystemFont, sans-serif;
	line-height: 1.4;
	margin: 1rem;
	max-width: 90%;
	padding: 1rem;
	text-align: left;
	font-size: 12px;
	word-break: break-word;
	z-index: 20;
	box-shadow: 0 4px 20px rgba(255, 75, 110, 0.4);
}

// Tombol "Coba Lagi": muat ulang halaman (unduhan yang sudah selesai diambil lagi dari cache browser).
function addRetryButton() {
	const errDiv = document.getElementById('status-notice');
	if (!errDiv || document.getElementById('status-retry')) {
		return;
	}
	const b = document.createElement('button');
	b.id = 'status-retry';
	b.textContent = '↻ Coba Lagi';
	b.onclick = function () {
		const u = new URL(window.location.href);
		u.searchParams.set('r', Date.now().toString(36));
		window.location.replace(u.toString());
	};
	errDiv.appendChild(b);
}

// Tangkap semua console.error agar tampil di layar iPhone
const origConsoleError = console.error;
console.error = function() {
	origConsoleError.apply(console, arguments);
	const errDiv = document.getElementById('status-notice');
	const statusOverlay = document.getElementById('status');
	if (errDiv) {
		const args = Array.from(arguments).map(a => {
			if (a instanceof Error) return a.message + (a.stack ? '\n' + a.stack : '');
			if (typeof a === 'object') {
				try { return JSON.stringify(a); } catch(e) { return String(a); }
			}
			return String(a);
		}).join(' ');
		errDiv.style.display = 'block';
		errDiv.innerHTML += '<br><strong>⚠️ Log Error:</strong><br><pre style="font-size:10px; max-height:100px; overflow:auto;">' + args + '</pre>';
	}
	if (statusOverlay) {
		statusOverlay.style.visibility = 'visible';
	}
};

// Global Error Handler agar error apapun di iPhone langsung muncul di layar
window.onerror = function(msg, url, line, col, error) {
	// Abaikan generic "Script error." tanpa detail karena biasanya dari Safari extension / background
	if (!error && (msg === 'Script error.' || msg === 'Script error' || !url)) {
		console.warn('Ignored uninformative script error');
		return false;
	}
	const errDiv = document.getElementById('status-notice');
	const statusOverlay = document.getElementById('status');
	if (errDiv) {
		errDiv.style.display = 'block';
		let detail = msg;
		if (error && error.message) {
			detail += '<br>Detail: ' + error.message;
		}
		errDiv.innerHTML = '<strong>⚠️ JavaScript Error di iPhone:</strong><br>' + 
			detail + '<br><small>' + (url ? url.split('/').pop() : '') + ':' + line + '</small>' +
			(error && error.stack ? '<br><pre style="font-size:10px; max-height:120px; overflow:auto;">' + error.stack + '</pre>' : '');
	}
	if (statusOverlay) {
		statusOverlay.style.visibility = 'visible';
	}
	return false;
};

window.addEventListener('unhandledrejection', function(event) {
	const errDiv = document.getElementById('status-notice');
	const statusOverlay = document.getElementById('status');
	if (errDiv) {
		errDiv.style.display = 'block';
		const reason = event.reason ? (event.reason.stack || event.reason.message || event.reason) : 'Promise Rejection';
		errDiv.innerHTML = '<strong>⚠️ Web Engine Rejection:</strong><br><pre style="font-size:10px; max-height:100px; overflow:auto;">' + reason + '</pre>';
		addRetryButton();
	}
	if (statusOverlay) {
		statusOverlay.style.visibility = 'visible';
	}
});

// - Mobile browsers kill downloads when the tab goes to the background. Every file (.pck parts and .wasm)
//   is therefore streamed with RESUME: on a network error / stall / truncated body it waits until the tab
//   is visible again and continues from the last byte with an HTTP Range request (bypassing the HTTP cache,
//   so a broken cached copy can never block the next try).

		{ re: /Euphoria_v2\.wasm(\?|$)/, parts: ['Euphoria_v2.wasm'], type: 'application/wasm' },

		if (!document.hidden) {
			return Promise.resolve();
		}

			const f = () => {

		let t = null;

			p.finally(() => clearTimeout(t)),

const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusText = document.getElementById('status-text');
	const statusDetail = document.getElementById('status-detail');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		if (statusText) statusText.style.display = mode === 'progress' ? 'block' : 'none';
		if (statusDetail) statusDetail.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		addRetryButton();
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'Error\nFitur yang dibutuhkan browser tidak tersedia:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));

		statusProgress.removeAttribute('value');

		statusDetail.textContent = 'Pertama kali agak lama — berikutnya jauh lebih cepat (tersimpan di cache).';
		// rotating gameplay tips while loading
		const TIPS = [
			'<b>Tip:</b> Tank di kolom depan menahan serangan — hero menyerang musuh di <b>baris yang sama</b>.',
			'<b>Tip:</b> Ketuk <b>hati berdenyut</b> di lobby setiap hari untuk Secretary Moment bersama hero-mu.',
			'<b>Tip:</b> 150 Summon Point di banner rate-up bisa ditukar langsung dengan <b>hero unggulan</b>.',
			'<b>Tip:</b> Pasang pasangan <b>Story Links</b> (misalnya Shina + Zennyo) untuk bonus stat.',
			'<b>Tip:</b> <b>Commander Tactics</b> aktif otomatis sekali per battle — pilih sesuai lawan.',
			'<b>Tip:</b> Boss Hunt memberi <b>Hunt Core</b> untuk Limit Break hingga Lv.100.',
			'<b>Tip:</b> Di <b>Starlight Rift</b>, Blessing menumpuk sepanjang run. Satu kekalahan mengakhiri run.',
			'<b>Tip:</b> Setiap hero punya <b>ruangan favorit</b> di Private Room — Bond dua kali lipat di sana.',

		];
		const tipEl = document.getElementById('status-tip');
		let tipIdx = Math.floor(Math.random() * TIPS.length);

			tipEl.style.opacity = 0;
			setTimeout(function () { tipEl.innerHTML = TIPS[tipIdx % TIPS.length]; tipIdx++; tipEl.style.opacity = 1; }, 450);
		}
		nextTip();
		const tipTimer = setInterval(nextTip, 4000);
		const pctEl = document.getElementById('status-pct');

		if (window.__euphoriaNet) {
			window.__euphoriaNet.onRetry = function (hidden, fails) {

				statusText.textContent = hidden ? 'Unduhan dijeda (tab di latar belakang)' : 'Koneksi terputus — menyambung ulang... (' + fails + ')';
				statusDetail.textContent = 'Tenang, unduhan lanjut dari posisi terakhir, tidak mulai dari awal.';
			};
			window.__euphoriaNet.onResume = function () {
				statusText.textContent = 'Melanjutkan unduhan...';
			};
		}

		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					const pct = Math.min(100, Math.round((current / total) * 100));
					const curMB = (current / (1024 * 1024)).toFixed(1);
					const totMB = (total / (1024 * 1024)).toFixed(1);
					pctEl.textContent = pct + '%';
					statusText.textContent = 'Mengunduh aset: ' + curMB + ' MB / ' + totMB + ' MB';
					reconnecting = false;
					if (pct < 100) {
						statusDetail.textContent = 'Mengunduh data grafik karakter & cutscene HD...';
					} else {
						statusText.textContent = 'Unduhan selesai! Menyiapkan dunia Euphoria...';
						statusDetail.textContent = 'Memulai engine grafis, mohon tunggu beberapa detik...';
					}
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			clearInterval(tipTimer);
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
